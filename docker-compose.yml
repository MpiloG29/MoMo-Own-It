services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: momo
      POSTGRES_PASSWORD: momo
      POSTGRES_DB: momo_own_it
    ports:
      - "5432:5432"
    volumes:
      - momo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U momo -d momo_own_it"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  momo_pgdata:
